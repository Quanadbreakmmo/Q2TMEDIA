name: Q2T Media — Sync Facebook Data

on:
  schedule:
    # Chạy mỗi 5 phút
    - cron: '*/5 * * * *'
  # Cho phép chạy thủ công
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Facebook sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync.js
        
      - name: Log result
        if: always()
        run: echo "Sync completed at $(date)"
